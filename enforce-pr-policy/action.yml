name: "Enforce PR Branch Policy"
description: "Validates that PRs follow branch naming rules."
author: "Kevin Kleber"

inputs:
  github-token:
    description: "GitHub token for authentication"
    required: true

runs:
  using: "composite"
  steps:
    - name: Validate PR Branch Rules
      shell: bash
      run: ${{ github.action_path }}/validate-pr.sh
